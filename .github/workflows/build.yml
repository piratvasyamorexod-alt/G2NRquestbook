name: Build G2NRquestbook
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and run journal tests
        shell: powershell
        run: |
          cmake -S tests -B _tests -G "Visual Studio 17 2022" -A Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build _tests --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir _tests -C Release --output-on-failure
      - name: Build the Union plugin and VDF
        shell: powershell
        run: ./Build-Windows.ps1
      - name: Upload the VDF
        uses: actions/upload-artifact@v4
        with:
          name: G2NRquestbook
          path: release/G2NRquestbook.vdf
          if-no-files-found: error
